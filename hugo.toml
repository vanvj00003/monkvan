baseURL = 'https://vanvj00002.github.io/monkvan/'
languageCode = 'zh-CN'
title = 'monkvan'
theme = ["fixit"]

defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true
enableGitInfo = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  version = "0.3.X"
  since = 2025
  description = "老梵的个人随笔和思考"
  
  [params.header]
    [params.header.title]
      name = "老梵的空中小屋"

[params.author]
  name = "老梵"
  description = "老梵（vanvj00002）是一名热衷技术与文化的个人随笔作者，擅长前端开发与内容创作。"
  
  [params.home]
    sort = "date"
    paginate = 12
    dateFormat = "2006-01-02"
    readMore = true

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 2
  [[menu.main]]
    identifier = "index"
    name = "索引"
    url = "/index/"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 4
